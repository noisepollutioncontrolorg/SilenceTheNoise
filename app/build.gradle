plugins {
    id 'com.android.application'
}

// Release signing details are supplied securely by GitHub Actions environment variables.
def signingEnvNames = ['STN_KEYSTORE_PATH', 'STN_KEYSTORE_PASSWORD', 'STN_KEY_ALIAS', 'STN_KEY_PASSWORD']
def releaseSigningReady = signingEnvNames.every { System.getenv(it) }

android {
    namespace 'in.silencethenoise.app'
    compileSdk 34

    defaultConfig {
        applicationId "in.silencethenoise.app"
        minSdk 24
        targetSdk 34
        versionCode 5
        versionName "5.0"
    }
    signingConfigs {
        if (releaseSigningReady) {
            release {
                storeFile file(System.getenv('STN_KEYSTORE_PATH'))
                storePassword System.getenv('STN_KEYSTORE_PASSWORD')
                keyAlias System.getenv('STN_KEY_ALIAS')
                keyPassword System.getenv('STN_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (releaseSigningReady) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
}
